name: build

# PRs: build + upload the APK as an artifact.
# main: build + publish release v1.0.<run>, which Obtainium picks up.
on:
  push:
    branches: [main]
    paths: ["app/**", "server/web/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["app/**", "server/web/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > debug.keystore
          elif [ "$EVENT_NAME" != "pull_request" ] && [ "$GIT_REF" = "refs/heads/main" ]; then
            # Publishing a release signed with a throwaway key gives Obtainium a
            # version that Android then refuses to install over the existing one.
            echo "::error::KEYSTORE_B64 is not set; refusing to publish an unupgradeable release."
            exit 1
          else
            echo "::warning::KEYSTORE_B64 not set; throwaway key, PR artifact only (won't upgrade installs)"
          fi

      - name: Build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS || 'android' }}
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: birdfy-viewer-${{ env.VERSION_NAME }}
          path: app/birdfy-viewer.apk

      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" birdfy-viewer.apk \
            --target "$GITHUB_SHA" --title "Birdfy Viewer $VERSION_NAME" --generate-notes
